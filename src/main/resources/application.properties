spring.application.name=loan-service

# Datasource mode feature flag for safe rollout.
# Options: "legacy" (CDW tables), "modern" (normalized schema), "dual" (shadow comparison)
# In dual mode, legacy response is served while modern is compared in background.
datasource.mode=modern

# Data Source Configuration
# Uses H2 in-memory database with both legacy and modern schemas
spring.datasource.url=jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize both legacy and modern schemas on startup.
# Legacy schema is loaded first for migration source data,
# then modern schema is created for migration target.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql,classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-legacy.sql
spring.sql.init.continue-on-error=true
