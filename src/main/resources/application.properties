spring.application.name=loan-service

# Modern Data Source Configuration
# Connects to the normalized modern schema with proper types and FK constraints
spring.datasource.url=jdbc:h2:mem:moderndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize modern schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-modern.sql
