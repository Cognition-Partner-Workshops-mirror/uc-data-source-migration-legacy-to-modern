spring.application.name=loan-service

# Data Source Configuration
# Both legacy and modern tables live in the same H2 database
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize both legacy and modern schemas on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql,classpath:schema-modern.sql
spring.sql.init.data-locations=classpath:data-legacy.sql

# Data source mode: legacy, modern, or dual
# - legacy: reads from legacy CDW tables (default)
# - modern: reads from modern normalized tables (requires migration first)
# - dual: reads from both, compares results, returns legacy data
datasource.mode=legacy
