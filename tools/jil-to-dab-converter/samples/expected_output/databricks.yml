bundle:
  name: banking_etl_migration
resources:
  jobs:
    box_loan_etl_daily:
      name: Daily loan data ETL pipeline — extracts, transforms, and loads loan records
      tasks:
      - task_key: fw_loan_data_file
        description: 'File watcher migrated from AutoSys: FW_LOAN_DATA_FILE'
        shell_command_task:
          command: '# TODO: Replace with Auto Loader or cloud event trigger

            # Original watched file: /data/incoming/loan_extract_*.csv'
      - task_key: cmd_validate_loan_file
        description: Validate loan file format, checksums, and record counts
        shell_command_task:
          command: source /opt/etl/.profile && /opt/etl/scripts/validate_loan_file.sh
        depends_on:
        - task_key: fw_loan_data_file
        max_retries: 2
      - task_key: cmd_load_staging
        description: Load validated loan records into staging schema
        notebook_task:
          notebook_path: /Workspace/migrated_jobs/cmd_load_staging
        depends_on:
        - task_key: cmd_validate_loan_file
        max_retries: 1
        timeout_seconds: 3600
      - task_key: cmd_transform_loans
        description: 'Apply business rules: status expansion, LTV calculation, date normalization'
        notebook_task:
          notebook_path: /Workspace/migrated_jobs/cmd_transform_loans
        depends_on:
        - task_key: cmd_load_staging
        timeout_seconds: 5400
      - task_key: cmd_load_production
        description: Merge transformed loan data into production tables
        notebook_task:
          notebook_path: /Workspace/migrated_jobs/cmd_load_production
        depends_on:
        - task_key: cmd_transform_loans
        max_retries: 1
        timeout_seconds: 2700
      - task_key: cmd_generate_reports
        description: Generate daily loan summary and exception reports
        shell_command_task:
          command: /opt/etl/scripts/generate_loan_reports.sh
        depends_on:
        - task_key: cmd_load_production
      schedule:
        quartz_cron_expression: 0 00 06 ? * MON,TUE,WED,THU,FRI
        timezone_id: US/Eastern
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
        - etl_admin@bank.com
      timeout_seconds: 14400
      tags:
        autosys_source: BOX_LOAN_ETL_DAILY
        migration_type: box_job
    box_weekly_reconciliation:
      name: Weekly reconciliation batch — compares DW totals against source systems
      tasks:
      - task_key: cmd_extract_source_totals
        description: Pull current totals from all source banking systems
        shell_command_task:
          command: /opt/recon/scripts/extract_source_totals.sh
        max_retries: 2
        timeout_seconds: 3600
      - task_key: cmd_extract_dw_totals
        description: Pull current totals from data warehouse tables
        notebook_task:
          notebook_path: /Workspace/migrated_jobs/cmd_extract_dw_totals
        timeout_seconds: 3600
      - task_key: cmd_reconciliation_report
        description: Compare source vs DW totals and generate variance report
        shell_command_task:
          command: /opt/recon/scripts/generate_recon_report.sh
        depends_on:
        - task_key: cmd_extract_source_totals
        - task_key: cmd_extract_dw_totals
      schedule:
        quartz_cron_expression: 0 00 00 ? * SAT
        timezone_id: US/Eastern
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
        - finance_team@bank.com
      timeout_seconds: 21600
      tags:
        autosys_source: BOX_WEEKLY_RECONCILIATION
        migration_type: box_job
    cmd_account_balance_sync:
      name: Hourly sync of account balances from core banking to data warehouse
      tasks:
      - task_key: cmd_account_balance_sync
        description: Hourly sync of account balances from core banking to data warehouse
        shell_command_task:
          command: source /opt/sync/.profile && /opt/sync/scripts/sync_account_balances.py
        max_retries: 3
        timeout_seconds: 1800
      schedule:
        quartz_cron_expression: 0 0 00 ? * MON,TUE,WED,THU,FRI
        timezone_id: US/Eastern
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
        - ops_team@bank.com
      timeout_seconds: 1800
      tags:
        autosys_source: CMD_ACCOUNT_BALANCE_SYNC
        migration_type: command_job
    fw_borrower_updates:
      name: File arrival handler for FW_BORROWER_UPDATES
      tasks:
      - task_key: fw_borrower_updates_process
        description: 'Processing task triggered by file watcher: FW_BORROWER_UPDATES'
        notebook_task:
          notebook_path: /Workspace/migrated_jobs/fw_borrower_updates_process
      tags:
        autosys_source: FW_BORROWER_UPDATES
        migration_type: file_watcher
    ft_archive_loan_files:
      name: Archive processed loan extract files to long-term storage
      tasks:
      - task_key: ft_archive_loan_files
        description: Archive processed loan extract files to long-term storage
        shell_command_task:
          command: '# Migrated from AutoSys FT job: FT_ARCHIVE_LOAN_FILES

            # Original: etl_server_01:/data/incoming/loan_extract_*.csv -> archive_server:/archive/loans/

            dbutils.fs.cp(''dbfs:/mnt/data/data/incoming/loan_extract_*.csv'', ''dbfs:/mnt/data/archive/loans/'')'
      schedule:
        quartz_cron_expression: 0 00 10 ? * MON,TUE,WED,THU,FRI
        timezone_id: UTC
        pause_status: UNPAUSED
      tags:
        autosys_source: FT_ARCHIVE_LOAN_FILES
        migration_type: file_transfer
